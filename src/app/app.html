<div class="container">

  <!-- Header -->
  <header class="navbar">

    <div class="logo">
      <h2>QuickBuy</h2>
    </div>

    <!-- <div class="search-box">
      <input type="text" placeholder="Search items...">
      <button>🔍</button>
    </div> -->

    <!-- <button class="add-btn">+ Add Item</button> -->

  </header>

  <!-- Hero -->
  <section class="hero">

    <div class="hero-content">

      <h1>Buy & Sell Anything</h1>

      <p>Find great deals near you</p>

      <button>Browse Items</button>

    </div>

  </section>

  <!-- Latest Items -->
  <section>

    <h2 class="title">Latest Items</h2>

    <div class="card-container">

      @for (product of products; track product.name) {
      <div class="card">

        <img [src]="product.image" [alt]="product.name">

        <div class="card-body">

          <h3>{{ product.name }}</h3>

          <p>Very good condition. Battery 85%.</p>

          <p class="price">₹45,000</p>

          <div class="buttons">
            <a class="call" href="tel:+918564087830">Call</a>

            <a class="whatsapp" href="https://wa.me/918564087830" target="_blank">
              WhatsApp
            </a>
          </div>

        </div>

      </div>
      }

    </div>

  </section>

  <!-- Footer -->

  <footer>

    <div>
      <h3>QuickBuy</h3>
      <p>Buy & Sell anything easily.</p>
    </div>

    <div>
      <h3>Contact</h3>
      <p>8564087830</p>
      <p>info@quickbuy.com</p>
    </div>

  </footer>

</div>
