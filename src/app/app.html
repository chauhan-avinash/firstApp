<div class="container">

  <!-- Header -->
  <header class="navbar">

    <div class="logo">
      <h2>QuickBuy</h2>
    </div>

    <div class="search-box">
      <input type="text" placeholder="Search items...">
      <button>🔍</button>
    </div>

    <button class="add-btn">+ Add Item</button>

  </header>

  <!-- Hero -->
  <section class="hero">

    <div class="hero-content">

      <h1>Buy & Sell Anything</h1>

      <p>Find great deals near you</p>

      <button>Browse Items</button>

    </div>

  </section>

  <!-- Latest Items -->
  <section>

    <h2 class="title">Latest Items</h2>

    <div class="card-container">

      <div class="card" *ngFor="let item of [1,2,3,4]">

        <img src="https://picsum.photos/300/200" alt="">

        <span class="price">₹45,000</span>

        <div class="card-body">

          <h3>iPhone 13 128GB</h3>

          <p>Very good condition. Battery 85%.</p>

          <p>📞 9876543210</p>

          <div class="buttons">

            <button class="call">Call</button>

            <button class="whatsapp">WhatsApp</button>

          </div>

        </div>

      </div>

    </div>

  </section>

  <!-- Footer -->

  <footer>

    <div>
      <h3>QuickBuy</h3>
      <p>Buy & Sell anything easily.</p>
    </div>

    <div>
      <h3>Contact</h3>
      <p>9876543210</p>
      <p>info@quickbuy.com</p>
    </div>

  </footer>

</div>
